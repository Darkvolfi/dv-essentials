mod_description=Catch souls in jars, release them, fuse two into a new creature, burn them as fuel, and bind any creature to you at an altar. A collared pet that dies leaves a copy of its soul to bring it back. Distil souls into essences for charms that give their creatures' powers. Part of Darkvolfi's DV mods.
