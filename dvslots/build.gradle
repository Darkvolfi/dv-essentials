plugins {
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
}

apply from: rootProject.file('gradle/dv-mod.gradle')

mixin {
    add sourceSets.main, 'dvslots.refmap.json'
    config 'dvslots.mixins.json'
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
