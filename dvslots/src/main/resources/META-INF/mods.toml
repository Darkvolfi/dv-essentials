modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Darkvolfi/dv-essentials/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Darkvolfi/dv-essentials"
logoFile="${mod_id}_logo.png"
authors="${mod_authors}"
description='''${mod_description}'''
# Slot contents live on the server and flight is checked on both sides: install on both.
displayTest="IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"


[[dependencies.${mod_id}]]
    modId="dvlib"
    mandatory=true
    versionRange="${dvlib_range}"
    ordering="AFTER"
    side="BOTH"
