modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Darkvolfi/dv-essentials/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Darkvolfi/dv-essentials"
logoFile="${mod_id}_logo.png"
authors="${mod_authors}"
description='''${mod_description}'''
# New items and blocks: install on both.

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional: with DV Lib the recipe editor also opens from the DV menu.
[[dependencies.${mod_id}]]
    modId="dvlib"
    mandatory=false
    versionRange="${dvlib_range}"
    ordering="NONE"
    side="CLIENT"
